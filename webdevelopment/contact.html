<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Starter Template</title>
        <!-- Link to external CSS for styling --> 
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="nav.css">
        <!-- Favicon -->
        <link rel="icon" type="media/x-icon" href="media/favicon.ico">
    </head>

    <body>
        <!-- Header -->
        <header>
            <nav>
                <a href="index.html">
                    <img src="media/logo.png" alt="Logo" class="logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="career.html">Career</a></li>
                    <li><a href="reflection.html">Reflection</a></li>
                    <li><a href="about.html">About Me</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Page Header -->
        <section id="sub-header">
            <div class="sub-header-page">
                <div class="info">
                    <h1>Contact</h1>
                    <h2>I'd like to hear from you!</h2>
                </div>
            </div>
        </section>

        <!-- Main content of the page -->
        <main>
            <div class="contact">
                <div class="section">
                    <h2>Get in Touch</h2>
                    <p>If you have any inquireies or just want to say hi, please use the contact form!</p>
                </div>

                <!-- Form -->
                <div class="form">
                    <form action="mailto:gomuang@missouri.edu?Subject=Contact%20Form" method="post" enctype="text/plain">
                        <div class="form-group">
                            <label for="titles">Title</label>
                            <select name="titles" id="titles" required>
                                <option value="">--Choose an option--</option>
                                <option value="mr">Mr</option>
                                <option value="mrs">Mrs</option>
                                <option value="ms">Ms</option>
                                <option value="miss">Miss</option>
                                <option value="dr">Dr</option>
                                <option value="rev">Rev</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="fullname">Full name</label>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea name="message" id="message" placeholder="Your Message" required></textarea>
                        </div>
                        <div>
                            <fieldset>
                                <legend>Do you want to subscribe to our newsletter?</legend>
                                <input type="radio" id="subscribe-yes" name="subscribe" value="yes" required>
                                <label for="subscribe-yes">Yes</label>
                                <input type="radio" id="subscribe-no" name="subscribe" value="no" required>
                                <label for="subscribe-no">No</label>
                            </fieldset>
                        </div>
                        <div>
                            <button type="submit">Send message</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <!-- Footer content goes here -->
                <p>Go Muang © 2026</p>
                <div class="footer-links">
                    <a href="mailto:gomuang@missouri.edu"><img src="media/email.png" alt="Email Icon"></a>
                    <a href="tel:+1234567890"><img src="media/phone.png" alt="Phone Icon"></a>
                </div>
            </div>
        </footer>
    </body>
</html>
